name: AI pull request note

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  note:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      models: read

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect pull request diff
        id: diff
        run: |
          gh pr diff "$PR_NUMBER" --repo "$REPO" > pr.diff
          {
            echo 'diff<<EOF'
            head -c 18000 pr.diff
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

      - name: Collect focused file context
        id: context
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          diff = Path('pr.diff').read_text(errors='replace').splitlines()
          files = {}
          current = None
          for line in diff:
              if line.startswith('+++ b/'):
                  current = line[6:]
                  files.setdefault(current, [])
              elif current and line.startswith('@@'):
                  match = re.search(r'\+(\d+)(?:,(\d+))?', line)
                  if match:
                      start = int(match.group(1))
                      count = int(match.group(2) or '1')
                      files[current].append((start, start + max(count, 1) - 1))
          chunks = []
          for path, ranges in files.items():
              file_path = Path(path)
              if not file_path.is_file() or file_path.stat().st_size > 120000:
                  continue
              lines = file_path.read_text(errors='replace').splitlines()
              used = []
              for start, end in ranges[:5]:
                  a = max(1, start - 25)
                  b = min(len(lines), end + 25)
                  if used and a <= used[-1][1] + 10:
                      used[-1] = (used[-1][0], max(used[-1][1], b))
                  else:
                      used.append((a, b))
              for a, b in used[:4]:
                  chunks.append(f'--- {path}:{a}-{b} ---')
                  chunks.extend(f'{i}: {lines[i-1]}' for i in range(a, b + 1))
          Path('focused-context.txt').write_text('\n'.join(chunks)[:10000])
          PY
          {
            echo 'context<<EOF'
            cat focused-context.txt
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run AI pull request note
        id: note
        uses: actions/ai-inference@v2.1.1
        with:
          prompt: |
            Review this PR using the diff and nearby context. Give maintainer feedback only when supported by that text.

            Focus: correctness, code quality, maintainability, tests, documentation/API clarity. Avoid praise and speculation. If no concrete note is supported, say: No concrete follow-up notes.

            Format:
            **Summary**
            One sentence.

            **Review notes**
            - Up to two concrete notes, or exactly: No concrete follow-up notes.

            Include a **Risk** section only when the diff/context shows a concrete runtime, compatibility, CI, or test risk.

            Title:
            ${{ github.event.pull_request.title }}

            Body:
            ${{ github.event.pull_request.body }}

            Diff:
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

            Context:
            ```
            ${{ steps.context.outputs.context }}
            ```

      - name: Create or update PR note comment
        run: |
          cat > ai-response.md <<'EOF'
          ${{ steps.note.outputs.response }}
          EOF

          python - <<'PY'
          from pathlib import Path
          marker = '<!-- ai-pr-note -->'
          heading = '## AI pull request note'
          max_chars = 2200
          response = Path('ai-response.md').read_text().strip()
          if not response:
              response = '**Summary**\nNo summary returned.\n\n**Review notes**\nNo concrete follow-up notes.'
          body = f'{marker}\n{heading}\n\n{response}\n'
          if len(body) > max_chars:
              snippet = body[:max_chars]
              cut = max(snippet.rfind('\n\n'), snippet.rfind('\n- '), snippet.rfind('. '))
              body = snippet[:cut + 1].strip() if cut > 200 else snippet.rstrip()
              body += '\n\n_Output shortened by workflow._\n'
          Path('note.md').write_text(body)
          PY
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- ai-pr-note -->") or contains("<!-- ai-pr-summary -->") or contains("<!-- ai-pr-review -->"))) | .id' \
            | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" --method PATCH --field body="$(cat note.md)"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file note.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
